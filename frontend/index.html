<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="DharMarnatee — condições marinhas e meteorológicas para o litoral brasileiro"
    />
    <meta name="theme-color" content="#0d1b2a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>DharMarnatee — Clima, Vento, Ondas e Maré</title>
    <!-- PWA manifest (descomente quando criar o manifest.json)
  <link rel="manifest" href="manifest.json">
  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ── Header ─────────────────────────────────────────────────── -->
    <header class="app-header">
      <div class="header-inner">
        <div class="header-brand">
          <img
            src="manatee.png"
            alt="Rosto de peixe-boi"
            class="brand-icon brand-logo"
          />
          <div>
            <h1 class="app-title">DharMarnatee</h1>
            <p class="app-subtitle">Clima, Vento, Ondas e Maré</p>
          </div>
        </div>
      </div>
    </header>

    <!-- ── Main ──────────────────────────────────────────────────── -->
    <main class="app-main">
      <!-- Search -->
      <section class="search-section" aria-label="Busca de localização">
        <div class="search-box">
          <div class="search-input-wrap">
            <span class="search-icon" aria-hidden="true">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
            </span>
            <input
              type="search"
              id="searchInput"
              class="search-input"
              placeholder="Digite uma cidade, praia ou local"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="none"
              spellcheck="false"
              aria-label="Buscar local"
            />
          </div>
          <button
            id="searchBtn"
            class="search-btn"
            type="button"
            aria-label="Buscar"
          >
            Buscar
          </button>
        </div>

        <!-- Search result picker (shown when multiple matches) -->
        <div
          id="searchResults"
          class="search-results"
          hidden
          role="listbox"
          aria-label="Resultados da busca"
        ></div>
      </section>

      <!-- Status messages (errors, warnings) -->
      <div
        id="statusMsg"
        class="status-msg"
        hidden
        role="alert"
        aria-live="polite"
      ></div>

      <!-- Loading skeleton -->
      <div
        id="loadingState"
        class="loading-state"
        hidden
        aria-label="Carregando dados..."
        aria-busy="true"
      >
        <div class="skeleton-strip"></div>
        <div class="skeleton-grid">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
        <div class="skeleton-footer"></div>
      </div>

      <!-- ── Data section ──────────────────────────────────────────── -->
      <section id="dataSection" class="data-section" hidden aria-live="polite">
        <!-- Location strip -->
        <div id="locationStrip" class="location-strip"></div>

        <!-- Four main cards -->
        <div class="cards-grid" role="region" aria-label="Condições atuais">
          <article
            id="cardClima"
            class="card card--clima"
            aria-label="Clima"
          ></article>
          <article
            id="cardVento"
            class="card card--vento"
            aria-label="Vento"
          ></article>
          <article
            id="cardOndas"
            class="card card--ondas"
            aria-label="Ondas"
          ></article>
          <article
            id="cardMare"
            class="card card--mare"
            aria-label="Maré"
          ></article>
        </div>

        <!-- Source / metadata card -->
        <article
          id="cardFonte"
          class="card card--fonte"
          aria-label="Fonte dos dados"
        ></article>
      </section>

      <!-- Empty state (initial screen prompt) -->
      <div id="emptyState" class="empty-state" aria-label="Estado inicial">
        <div class="empty-icon">🌊</div>
        <p class="empty-title">Consulte as condições marinhas</p>
        <p class="empty-hint">Busque uma cidade, praia ou ponto costeiro</p>
      </div>
    </main>

    <footer class="app-footer">
      <p>DharMarnatee &nbsp;·&nbsp; Dados marinhos e meteorológicos</p>
      <p class="footer-note">
        Dados informativos. Não utilizar para navegação.
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
